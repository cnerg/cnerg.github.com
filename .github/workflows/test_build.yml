name: Build Jekyll site
on:
 pull_request:
 workflow_dispatch:

jobs:
  permissions:
    contents: read

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build
        uses: actions/jekyll-build-pages@v1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
           retention-days: 14
           

